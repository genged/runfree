name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit keeps its own verdict, including intermediate pushes.
  # Only superseded PR runs can be cancelled.
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  git-matrix:
    name: Git matrix (${{ matrix.runner }})
    # The Git-dependent tests on every pinned Git (tests/git-matrix/), on the
    # host OS of each family Runfree supports. Unprivileged like Verify: it
    # only downloads the public test binaries and checks their digests.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      RUNFREE_PNPM_VERSION: 10.34.8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.RUNFREE_PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the Git matrix
        run: make test-git
