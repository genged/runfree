name: Verify

# The one public verification lane, called by the per-commit Test workflow and
# by the release lane at the release SHA, so the two cannot drift apart.
#
# This lane is deliberately unprivileged. It runs on pull requests from forks,
# so it must never have write permissions, secrets, or a signing environment.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to verify. Defaults to the caller's ref."
        required: false
        type: string
      artifact-namespace:
        description: "Unique caller within a workflow run, such as a release tag"
        required: false
        type: string
        default: ci

permissions:
  contents: read

env:
  RUNFREE_BUN_VERSION: 1.3.14
  RUNFREE_PNPM_VERSION: 10.28.0

jobs:
  verify:
    name: Static, unit, and build
    # arm64, not ubuntu-latest: pnpm-workspace.yaml declares
    # `supportedArchitectures: {os: [darwin, linux], cpu: [arm64]}`, so an x64
    # runner installs @esbuild/darwin-arm64 and @esbuild/linux-arm64 but never
    # @esbuild/linux-x64, and the first `tsx` call dies with esbuild's
    # "installed for another platform" TransformError. The runner architecture
    # and that declaration have to agree; this side is the cheap one to move.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.RUNFREE_PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.RUNFREE_BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: make test-static

      - name: Run unit tests
        run: make test-unit

      # Static checks and unit tests read workspace sources, so they run above
      # on a clone with no `packages/*/dist`, which proves they do not depend
      # on it. `generate:assets` below reads `dist/runtime/**`.
      - name: Build runtime packages
        run: pnpm run build:runtime

      - name: Validate runtime templates
        run: make test-templates

      - name: Verify generated assets are current
        run: |
          pnpm run generate:assets
          git diff --exit-code -- packages/cli/src/embedded-assets.generated.ts

      - name: Build installable binary
        run: pnpm run build:bin

      - name: Smoke test binary
        run: pnpm run smoke:bin

      - name: Run packaged CLI end-to-end scenarios
        id: cli-e2e
        env:
          RUNFREE_E2E_ARTIFACT: ${{ github.workspace }}/dist/runfree
          RUNFREE_E2E_REPORT: ${{ runner.temp }}/runfree-e2e-evidence.json
        run: scripts/run-cli-e2e.sh --no-build

      # `if-no-files-found: error` is the point of this step: e2e evidence that
      # silently goes missing is worse than a failed upload. That only holds
      # once the scenarios have actually run, so skip the upload when an earlier
      # step failed and skipped them -- otherwise every failure in this lane
      # reports twice, the second time for a missing file nobody wrote.
      - name: Upload packaged CLI evidence
        if: always() && steps.cli-e2e.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-cli-e2e-evidence_${{ inputs.artifact-namespace }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/runfree-e2e-evidence.json
          if-no-files-found: error
